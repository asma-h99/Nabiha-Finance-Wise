openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Nabiha Financial Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User salary, currency, and onboarding profile
  - name: expenses
    description: Expense management
  - name: categories
    description: Expense categories
  - name: commitments
    description: Personal financial commitments
  - name: subscriptions
    description: Recurring subscriptions tracker
  - name: events
    description: Financial calendar events
  - name: notifications
    description: In-app notifications
  - name: simulator
    description: Borrowing capacity simulator
  - name: summary
    description: Dashboard summary and analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Create or update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List all expenses
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Priority"
        - name: month
          in: query
          required: false
          schema:
            type: string
            description: "YYYY-MM format"
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create a new expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseBody"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Get expense by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          description: Not found
    put:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseBody"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /commitments:
    get:
      operationId: listCommitments
      tags: [commitments]
      summary: List all financial commitments
      responses:
        "200":
          description: List of commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commitment"
    post:
      operationId: createCommitment
      tags: [commitments]
      summary: Create a financial commitment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommitmentBody"
      responses:
        "201":
          description: Created commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"

  /commitments/{id}:
    put:
      operationId: updateCommitment
      tags: [commitments]
      summary: Update a commitment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommitmentBody"
      responses:
        "200":
          description: Updated commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
    delete:
      operationId: deleteCommitment
      tags: [commitments]
      summary: Delete a commitment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List subscriptions
      responses:
        "200":
          description: Subscriptions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionBody"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}:
    put:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionBody"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      summary: Delete a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List financial calendar events
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
        - name: month
          in: query
          required: false
          schema:
            type: string
            description: "YYYY-MM format"
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    put:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "204":
          description: Marked all as read

  /simulator/borrowing-capacity:
    post:
      operationId: simulateBorrowingCapacity
      tags: [simulator]
      summary: Calculate borrowing capacity given desired loan params
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatorBody"
      responses:
        "200":
          description: Simulator result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorResult"

  /summary/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [summary]
      summary: Get dashboard summary with totals and breakdowns
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            description: "YYYY-MM format"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /summary/priority-breakdown:
    get:
      operationId: getPriorityBreakdown
      tags: [summary]
      summary: Get spending breakdown by priority level
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Priority breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriorityBreakdown"

  /summary/category-breakdown:
    get:
      operationId: getCategoryBreakdown
      tags: [summary]
      summary: Get spending breakdown by category
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdown"

  /summary/monthly-trend:
    get:
      operationId: getMonthlyTrend
      tags: [summary]
      summary: Get monthly spending trend for the last 6 months
      responses:
        "200":
          description: Monthly trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyTrend"

  /summary/subscriptions-breakdown:
    get:
      operationId: getSubscriptionsBreakdown
      tags: [summary]
      summary: Get monthly cost breakdown by subscription category
      responses:
        "200":
          description: Subscription breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionsBreakdown"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Currency:
      type: string
      enum: [JOD, SAR, AED, EGP, KWD, BHD, QAR, OMR, IQD, LBP, MAD, TND, DZD, LYD, YER, SDG, SYP, USD]

    Priority:
      type: string
      enum: [essential, important, luxury]

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        monthlySalary:
          type: number
        currency:
          $ref: "#/components/schemas/Currency"
        onboardingComplete:
          type: boolean
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - monthlySalary
        - currency
        - onboardingComplete
        - createdAt
        - updatedAt

    UpdateProfileBody:
      type: object
      properties:
        monthlySalary:
          type: number
        currency:
          $ref: "#/components/schemas/Currency"
        onboardingComplete:
          type: boolean
        displayName:
          type: string
          nullable: true

    Expense:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        amount:
          type: number
        priority:
          $ref: "#/components/schemas/Priority"
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - amount
        - priority
        - date
        - createdAt

    CreateExpenseBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
        priority:
          $ref: "#/components/schemas/Priority"
        categoryId:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date
      required:
        - title
        - amount
        - priority
        - date

    UpdateExpenseBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
        priority:
          $ref: "#/components/schemas/Priority"
        categoryId:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt

    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
      required:
        - name

    Commitment:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        amount:
          type: number
        dueDay:
          type: integer
        isPaid:
          type: boolean
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - amount
        - dueDay
        - isPaid
        - createdAt

    CreateCommitmentBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
        dueDay:
          type: integer
        notes:
          type: string
          nullable: true
      required:
        - title
        - amount
        - dueDay

    UpdateCommitmentBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
        dueDay:
          type: integer
        isPaid:
          type: boolean
        notes:
          type: string
          nullable: true

    SubscriptionFrequency:
      type: string
      enum: [monthly, yearly, weekly, quarterly]

    SubscriptionStatus:
      type: string
      enum: [active, inactive, upcoming]

    SubscriptionCategory:
      type: string
      enum: [streaming, music, productivity, fitness, other]

    Subscription:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        amount:
          type: number
        frequency:
          $ref: "#/components/schemas/SubscriptionFrequency"
        category:
          $ref: "#/components/schemas/SubscriptionCategory"
        nextRenewalDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        brandColor:
          type: string
          nullable: true
        brandIcon:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - amount
        - frequency
        - category
        - nextRenewalDate
        - status
        - createdAt

    CreateSubscriptionBody:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        frequency:
          $ref: "#/components/schemas/SubscriptionFrequency"
        category:
          $ref: "#/components/schemas/SubscriptionCategory"
        nextRenewalDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        brandColor:
          type: string
          nullable: true
        brandIcon:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - name
        - amount
        - frequency
        - category
        - nextRenewalDate

    UpdateSubscriptionBody:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        frequency:
          $ref: "#/components/schemas/SubscriptionFrequency"
        category:
          $ref: "#/components/schemas/SubscriptionCategory"
        nextRenewalDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        brandColor:
          type: string
          nullable: true
        brandIcon:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    EventType:
      type: string
      enum: [salary, bill, subscription, goal, reminder, expense]

    EventRecurrence:
      type: string
      enum: [none, weekly, monthly, yearly]

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        amount:
          type: number
          nullable: true
        date:
          type: string
          format: date
        type:
          $ref: "#/components/schemas/EventType"
        recurrence:
          $ref: "#/components/schemas/EventRecurrence"
        recurrenceEndDate:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - date
        - type
        - recurrence
        - createdAt

    CreateEventBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
          nullable: true
        date:
          type: string
          format: date
        type:
          $ref: "#/components/schemas/EventType"
        recurrence:
          $ref: "#/components/schemas/EventRecurrence"
        recurrenceEndDate:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - title
        - date
        - type

    UpdateEventBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
          nullable: true
        date:
          type: string
          format: date
        type:
          $ref: "#/components/schemas/EventType"
        recurrence:
          $ref: "#/components/schemas/EventRecurrence"
        recurrenceEndDate:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true

    NotificationType:
      type: string
      enum: [info, warning, success, danger]

    Notification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        type:
          $ref: "#/components/schemas/NotificationType"
        isRead:
          type: boolean
        link:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - message
        - type
        - isRead
        - createdAt

    SimulatorBody:
      type: object
      properties:
        loanAmount:
          type: number
        annualInterestRate:
          type: number
          description: Percentage e.g. 5.5
        termMonths:
          type: integer
        monthlySalary:
          type: number
          nullable: true
          description: Optional override of saved profile salary
      required:
        - loanAmount
        - annualInterestRate
        - termMonths

    SimulatorResult:
      type: object
      properties:
        monthlyPayment:
          type: number
        totalInterest:
          type: number
        totalRepayment:
          type: number
        debtToIncomeRatio:
          type: number
          description: Percentage of monthly salary consumed by this payment
        commitmentsTotal:
          type: number
        currentDebtToIncomeRatio:
          type: number
          description: Existing commitments + this payment vs salary, percentage
        affordability:
          type: string
          enum: [safe, caution, risky]
        projectedBalance:
          type: array
          items:
            type: object
            properties:
              month:
                type: integer
              remainingBalance:
                type: number
            required:
              - month
              - remainingBalance
      required:
        - monthlyPayment
        - totalInterest
        - totalRepayment
        - debtToIncomeRatio
        - commitmentsTotal
        - currentDebtToIncomeRatio
        - affordability
        - projectedBalance

    DashboardSummary:
      type: object
      properties:
        totalThisMonth:
          type: number
        totalLastMonth:
          type: number
        essentialTotal:
          type: number
        importantTotal:
          type: number
        luxuryTotal:
          type: number
        commitmentsTotal:
          type: number
        unpaidCommitmentsCount:
          type: integer
        subscriptionsTotal:
          type: number
        activeSubscriptionsCount:
          type: integer
        expensesCount:
          type: integer
        topCategory:
          type: string
          nullable: true
        monthlySalary:
          type: number
        currency:
          $ref: "#/components/schemas/Currency"
        remainingBalance:
          type: number
      required:
        - totalThisMonth
        - totalLastMonth
        - essentialTotal
        - importantTotal
        - luxuryTotal
        - commitmentsTotal
        - unpaidCommitmentsCount
        - subscriptionsTotal
        - activeSubscriptionsCount
        - expensesCount
        - monthlySalary
        - currency
        - remainingBalance

    PriorityBreakdown:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/Priority"
        total:
          type: number
        count:
          type: integer
        percentage:
          type: number
      required:
        - priority
        - total
        - count
        - percentage

    CategoryBreakdown:
      type: object
      properties:
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
        total:
          type: number
        count:
          type: integer
        percentage:
          type: number
      required:
        - categoryName
        - total
        - count
        - percentage

    MonthlyTrend:
      type: object
      properties:
        month:
          type: string
          description: "YYYY-MM format"
        total:
          type: number
        essential:
          type: number
        important:
          type: number
        luxury:
          type: number
      required:
        - month
        - total
        - essential
        - important
        - luxury

    SubscriptionsBreakdown:
      type: object
      properties:
