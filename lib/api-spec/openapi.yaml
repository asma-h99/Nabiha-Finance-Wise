openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Nabiha Financial Awareness API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: expenses
    description: Expense management
  - name: categories
    description: Expense categories
  - name: commitments
    description: Personal financial commitments
  - name: summary
    description: Dashboard summary and analytics
  - name: profile
    description: User salary and currency profile
  - name: notifications
    description: Email reminder notifications
  - name: subscriptions
    description: Recurring subscriptions tracker
  - name: calendar-events
    description: Calendar events (religious occasions, personal events, etc.)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List all expenses
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Priority"
        - name: month
          in: query
          required: false
          schema:
            type: string
            description: "YYYY-MM format"
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create a new expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseBody"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Get expense by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          description: Not found
    put:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseBody"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /commitments:
    get:
      operationId: listCommitments
      tags: [commitments]
      summary: List all financial commitments
      responses:
        "200":
          description: List of commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commitment"
    post:
      operationId: createCommitment
      tags: [commitments]
      summary: Create a financial commitment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommitmentBody"
      responses:
        "201":
          description: Created commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"

  /commitments/{id}:
    put:
      operationId: updateCommitment
      tags: [commitments]
      summary: Update a commitment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommitmentBody"
      responses:
        "200":
          description: Updated commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
    delete:
      operationId: deleteCommitment
      tags: [commitments]
      summary: Delete a commitment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /commitment-skips:
    get:
      operationId: listCommitmentSkips
      tags: [commitments]
      summary: List all monthly skips for recurring commitments
      responses:
        "200":
          description: List of commitment skips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommitmentSkip"

  /commitments/{id}/skip:
    post:
      operationId: skipCommitmentMonth
      tags: [commitments]
      summary: Skip a recurring commitment for a specific month
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommitmentSkipBody"
      responses:
        "201":
          description: Skip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitmentSkip"
        "409":
          description: Already skipped for this month

  /commitments/{id}/skip/{month}:
    delete:
      operationId: unskipCommitmentMonth
      tags: [commitments]
      summary: Remove a monthly skip (restore commitment for that month)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: path
          required: true
          schema:
            type: string
            description: "YYYY-MM format"
      responses:
        "204":
          description: Skip removed

  /summary/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [summary]
      summary: Get dashboard summary with totals and breakdowns
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            description: "YYYY-MM format"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /summary/priority-breakdown:
    get:
      operationId: getPriorityBreakdown
      tags: [summary]
      summary: Get spending breakdown by priority level
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Priority breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriorityBreakdown"

  /summary/category-breakdown:
    get:
      operationId: getCategoryBreakdown
      tags: [summary]
      summary: Get spending breakdown by category
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdown"

  /notifications/test:
    post:
      operationId: sendTestNotification
      tags: [notifications]
      summary: Send a test reminder email immediately to verify the connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTestBody"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRunResult"

  /notifications/run:
    post:
      operationId: runNotificationCheck
      tags: [notifications]
      summary: Manually run the reminder scheduler (also runs automatically every hour)
      responses:
        "200":
          description: Run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRunResult"

  /profile:
    get:
      operationId: getUserProfile
      tags: [profile]
      summary: Get current user's salary & currency profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateUserProfile
      tags: [profile]
      summary: Update salary, currency, or payday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List all recurring subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Add a new subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionBody"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}:
    put:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionBody"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      summary: Delete a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /summary/balance:
    get:
      operationId: getBalanceSummary
      tags: [summary]
      summary: Get monthly salary, outflow, and remaining balance
      responses:
        "200":
          description: Balance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSummary"

  /summary/savings:
    get:
      operationId: getAccumulatedSavings
      tags: [summary]
      summary: Get accumulated savings across all months
      responses:
        "200":
          description: Accumulated savings summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccumulatedSavings"

  /summary/monthly-trend:
    get:
      operationId: getMonthlyTrend
      tags: [summary]
      summary: Get monthly spending trend for the last 6 months
      responses:
        "200":
          description: Monthly trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyTrend"

  /calendar-events:
    get:
      operationId: listCalendarEvents
      tags: [calendar-events]
      summary: List calendar events with optional date range filters
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            description: "Start date in YYYY-MM-DD format"
        - name: to
          in: query
          required: false
          schema:
            type: string
            description: "End date in YYYY-MM-DD format"
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createCalendarEvent
      tags: [calendar-events]
      summary: Create a new calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarEventBody"
      responses:
        "201":
          description: Created calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /calendar-events/{id}:
    get:
      operationId: getCalendarEvent
      tags: [calendar-events]
      summary: Get a calendar event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "404":
          description: Not found
    put:
      operationId: updateCalendarEvent
      tags: [calendar-events]
      summary: Update a calendar event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCalendarEventBody"
      responses:
        "200":
          description: Updated calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar-events]
      summary: Delete a calendar event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Priority:
      type: string
      enum: [essential, important, luxury]

    Expense:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        amount:
          type: number
        priority:
          $ref: "#/components/schemas/Priority"
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - amount
        - priority
        - date
        - createdAt

    CreateExpenseBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
        priority:
          $ref: "#/components/schemas/Priority"
        categoryId:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date
      required:
        - title
        - amount
        - priority
        - date

    UpdateExpenseBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
        priority:
          $ref: "#/components/schemas/Priority"
        categoryId:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt

    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
      required:
        - name

    Commitment:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        amount:
          type: number
        dueDay:
          type: integer
          description: Day of month when due (1-31)
        isPaid:
          type: boolean
        notes:
          type: string
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
          description: Optional ISO date (YYYY-MM-DD) after which the commitment no longer recurs.
        isOneTime:
          type: boolean
          description: If true, this commitment appears only in oneTimeMonth and not in other months.
        oneTimeMonth:
          type: string
          nullable: true
          description: "YYYY-MM format. Required when isOneTime is true."
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - amount
        - dueDay
        - isPaid
        - isOneTime
        - createdAt

    CommitmentSkip:
      type: object
      properties:
        id:
          type: integer
        commitmentId:
          type: integer
        month:
          type: string
          description: "YYYY-MM format. The month in which the recurring commitment is skipped."
      required:
        - id
        - commitmentId
        - month

    CreateCommitmentBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
        dueDay:
          type: integer
        notes:
          type: string
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
          description: Optional ISO date (YYYY-MM-DD) after which the commitment no longer recurs.
        isOneTime:
          type: boolean
          description: If true, commitment only appears in oneTimeMonth.
        oneTimeMonth:
          type: string
          nullable: true
          description: "YYYY-MM format. Required when isOneTime is true."
      required:
        - title
        - amount
        - dueDay

    CreateCommitmentSkipBody:
      type: object
      properties:
        month:
          type: string
          description: "YYYY-MM format. The month to skip for this commitment."
      required:
        - month

    UpdateCommitmentBody:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
        dueDay:
          type: integer
        isPaid:
          type: boolean
        notes:
          type: string
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
          description: Optional ISO date (YYYY-MM-DD) after which the commitment no longer recurs.

    DashboardSummary:
      type: object
      properties:
        totalThisMonth:
          type: number
        totalLastMonth:
          type: number
        essentialTotal:
          type: number
        importantTotal:
          type: number
        luxuryTotal:
          type: number
        commitmentsTotal:
          type: number
        unpaidCommitmentsCount:
          type: integer
        expensesCount:
          type: integer
        topCategory:
          type: string
          nullable: true
      required:
        - totalThisMonth
        - totalLastMonth
        - essentialTotal
        - importantTotal
        - luxuryTotal
        - commitmentsTotal
        - unpaidCommitmentsCount
        - expensesCount

    PriorityBreakdown:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/Priority"
        total:
          type: number
        count:
          type: integer
        percentage:
          type: number
      required:
        - priority
        - total
        - count
        - percentage

    CategoryBreakdown:
      type: object
      properties:
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
        total:
          type: number
        count:
          type: integer
        percentage:
          type: number
      required:
        - categoryName
        - total
        - count
        - percentage

    MonthlyTrend:
      type: object
      properties:
        month:
          type: string
          description: "YYYY-MM format"
        total:
          type: number
        essential:
          type: number
        important:
          type: number
        luxury:
          type: number
      required:
        - month
        - total
        - essential
        - important
        - luxury

    UserProfile:
      type: object
      properties:
        monthlySalary:
          type: number
        currency:
          type: string
          description: ISO 4217 currency code (e.g. JOD, AED, SAR, USD)
        payday:
          type: integer
          description: Day of month salary is received (1-31)
        emailNotificationsEnabled:
          type: boolean
        notificationEmail:
          type: ["string", "null"]
          format: email
          maxLength: 320
        userName:
          type: ["string", "null"]
          maxLength: 80
        updatedAt:
          type: string
          format: date-time
      required:
        - monthlySalary
        - currency
        - payday
        - emailNotificationsEnabled
        - notificationEmail
        - userName
        - updatedAt

    UpdateUserProfileBody:
      type: object
      properties:
        monthlySalary:
          type: number
        currency:
          type: string
        payday:
          type: integer
        emailNotificationsEnabled:
          type: boolean
        notificationEmail:
          type: ["string", "null"]
          format: email
          maxLength: 320
        userName:
          type: ["string", "null"]
          maxLength: 80

    NotificationTestBody:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        userName:
          type: ["string", "null"]
          maxLength: 80
      required:
        - email

    NotificationRunResult:
      type: object
      properties:
        sent:
          type: integer
        skipped:
          type: integer
        message:
          type: string
      required:
        - sent
        - skipped
        - message

    BillingCycle:
      type: string
      enum: [monthly, yearly]

    Subscription:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        amount:
          type: number
        billingCycle:
          $ref: "#/components/schemas/BillingCycle"
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        renewsOnDay:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - amount
        - billingCycle
        - createdAt

    CreateSubscriptionBody:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        billingCycle:
          $ref: "#/components/schemas/BillingCycle"
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        renewsOnDay:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - name
        - amount
        - billingCycle

    UpdateSubscriptionBody:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        billingCycle:
          $ref: "#/components/schemas/BillingCycle"
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        renewsOnDay:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true

    BalanceSummary:
      type: object
      properties:
        currency:
          type: string
        monthlySalary:
          type: number
        subscriptionsMonthly:
          type: number
        commitmentsTotal:
          type: number
        unpaidCommitmentsTotal:
          type: number
        spentThisMonth:
          type: number
        projectedRemaining:
          type: number
          description: Salary minus subscriptions, unpaid commitments, and ad-hoc spend so far this month
        subscriptionsCount:
          type: integer
      required:
        - currency
        - monthlySalary
        - subscriptionsMonthly
        - commitmentsTotal
        - unpaidCommitmentsTotal
        - spentThisMonth
        - projectedRemaining
        - subscriptionsCount

    MonthlySavingsEntry:
      type: object
      properties:
        month:
          type: string
          description: "Month in YYYY-MM format"
        savings:
          type: number
          description: "Salary minus expenses, commitments, and subscriptions for this month"
        isCurrent:
          type: boolean
          description: "Whether this entry represents the current month"
      required:
        - month
