        - isCurrent

    AccumulatedSavings:
      type: object
      properties:
        currency:
          type: string
        totalSavings:
          type: number
          description: "Sum of all monthly savings (previous months + current month)"
        previousMonthsSavings:
          type: number
          description: "Sum of savings from all completed past months"
        currentMonthSavings:
